[workspace]
resolver = "2"
members = ["program", "packages/vault-core", "packages/vault-rust", "tests", "adapters/jupiter-lend",
    "adapters/custody"]

[workspace.dependencies]
vault-core = { path = "packages/vault-core", version = "0.0.1" }
pinocchio = { version = "=0.8.4", default-features = false }
pinocchio-token = "0.3.0"

# Financial boundaries use checked arithmetic as well as runtime overflow checks.
[profile.release]
overflow-checks = true

[profile.dev]
overflow-checks = true
