[package]
name = "vault-rust"
version = "0.0.1"
edition = "2021"
description = "Codama-generated Rust client for the Solana Vault Program"
license = "MIT"

# Kept by hand, not by the renderer: its own ranges would resolve a second
# solana-instruction and solana-address beside the workspace's.
[dependencies]
borsh = "1"
num-derive = "0.4"
num-traits = "0.2"
solana-account-info = "3.1"
solana-address = { version = "2.2", features = ["borsh", "copy", "curve25519", "decode"] }
solana-cpi = "3.1"
solana-instruction = "3.2"
solana-program-error = "3"
spl-collections = { version = "0.1", features = ["borsh"] }
thiserror = "1"

# The generated account pages carry RPC helpers behind a `fetch` feature this
# crate does not provide: solana-rpc-client would bring its whole dependency
# tree into the pinned lockfile.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("fetch"))'] }
